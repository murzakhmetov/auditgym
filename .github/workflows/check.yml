# The official offline check on three operating systems, plus the container exactly as the README runs it.
# Nothing here needs network access at run time except actions/checkout and the image base layer.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Official check (offline, standard library only)
        run: python -m auditgym check
      - name: Committed episodes and schemas regenerate byte for byte
        shell: bash
        run: |
          python -m auditgym build-splits
          python -m auditgym schemas
          git diff --stat --exit-code -- episodes schemas
      - name: Committed trajectories replay byte for byte
        shell: bash
        run: |
          python -m auditgym run --episodes episodes/train episodes/dev --policies random,recon,flag_all,oracle,auditor,silent --out runs/train_dev
          git diff --stat --exit-code -- runs/train_dev/trajectories.jsonl
      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report-${{ matrix.os }}
          path: runs/check/report.md

  docker:
    name: container (network none, 2 CPU, 4 GB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t auditgym .
      - name: Image size
        run: docker image ls auditgym --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Official check in the container
        shell: bash
        run: |
          set +e
          time docker run --name official --network none --cpus 2 --memory 4g --pids-limit 512 auditgym
          rc=$?
          docker cp official:/app/runs/check/unittest.log official_unittest.log
          docker cp official:/app/runs/check/report.md official_report.md
          docker rm official > /dev/null
          if [ "$rc" -ne 0 ]; then grep -E -A 40 "^(FAIL|ERROR): " official_unittest.log | head -200; fi
          exit "$rc"
      - name: Container-only isolation tests (root host, separate policy user, must not skip)
        run: |
          docker run --rm --network none --cpus 2 --memory 4g --pids-limit 512 auditgym python -m unittest tests.test_container -v 2>&1 | tee container_tests.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q skipped container_tests.log; then echo "container tests skipped"; exit 1; fi
          grep -q "test_agent_cannot_write_to_the_package.* ok" container_tests.log
          docker run --rm --network none --cpus 2 --memory 4g --pids-limit 512 auditgym python -m unittest tests.test_redteam -v
        shell: bash
      - name: Fallback with --user 10001 (policy runs as the same user, check still PASSES)
        run: |
          docker run --rm --network none --user 10001 --cpus 2 --memory 4g --pids-limit 512 auditgym 2>&1 | tee user10001.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^PASS in" user10001.log
          docker run --rm --network none --user 10001 auditgym python -m unittest tests.test_container -v
      - name: Fallback with --cap-drop ALL (root without setuid, check still PASSES)
        run: |
          docker run --rm --network none --cap-drop ALL --cpus 2 --memory 4g --pids-limit 512 auditgym 2>&1 | tee capdrop.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^PASS in" capdrop.log
          docker run --rm --network none --cap-drop ALL auditgym python -m unittest tests.test_container -v
      - name: Strict mode in the default image (AUDITGYM_REQUIRE_AGENT_USER=1, the policy really runs as the agent user)
        run: |
          docker run --rm --network none -e AUDITGYM_REQUIRE_AGENT_USER=1 --cpus 2 --memory 4g --pids-limit 512 auditgym 2>&1 | tee strict_default.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^PASS in" strict_default.log
          docker run --rm --network none -e AUDITGYM_REQUIRE_AGENT_USER=1 auditgym python -m unittest tests.test_container -v 2>&1 | tee strict_container.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qi "skipped" strict_container.log; then echo "a container test was skipped"; exit 1; fi
        shell: bash
      - name: Strict mode with --cap-drop ALL (must refuse with exit code 2 and one error line)
        run: |
          docker run --rm --network none --cap-drop ALL -e AUDITGYM_REQUIRE_AGENT_USER=1 auditgym > strict_capdrop.log 2>&1 && rc=0 || rc=$?
          cat strict_capdrop.log
          echo "exit code $rc"
          test "$rc" -eq 2
          test "$(grep -c . strict_capdrop.log)" -eq 1
          grep -q "^error: AUDITGYM_REQUIRE_AGENT_USER=1" strict_capdrop.log
        shell: bash
      - name: Upload the container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: |
            official_unittest.log
            official_report.md
            container_tests.log
            user10001.log
            capdrop.log
            strict_default.log
            strict_container.log
            strict_capdrop.log
          if-no-files-found: warn
