[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "0.3.0"
description = "Reproducible RL environment for financial-audit agents: synthetic companies, investigation tools, hidden errors, verifiable answer keys and a shared reward."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
auditgym = "auditgym.__main__:main"

[tool.setuptools.packages.find]
include = ["auditgym*"]

[tool.setuptools.package-data]
"auditgym.viewer" = ["template.html", "forcegraph.js"]
