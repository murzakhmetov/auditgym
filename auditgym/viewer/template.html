<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auditgym viewer</title>
<link rel="icon" href="data:,">
<style>
/* Direction (unslop): exact, sober, forensic. World: audit working papers at night, ink, ledger
   ruling, tick marks and a highlighter on the evidence. Moments: the evidence graph and the return
   heatmap. Signature: auditor tick marks (matched, unmatched, missed). */
:root{
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --r-tag:4px;--r-ctl:8px;--r-card:12px;--r-panel:16px;
}
body[data-theme=dark]{
  color-scheme:dark;
  --deep:#07080d;--bg:#0b0d14;--surface:#11141c;--surface-2:#161a23;--surface-3:#1d2230;
  --line:rgba(238,240,245,.07);--line-2:rgba(238,240,245,.12);
  --text:#eef0f5;--muted:#a3a9b8;--faint:#7a8296;
  --accent:#6f9bf2;--accent-soft:rgba(111,155,242,.14);--accent-text:#9dbcff;
  --ok:#4cc38a;--ok-soft:rgba(76,195,138,.12);--bad:#f0676c;--bad-soft:rgba(229,72,77,.13);
  --hl:#e2b04a;--hl-soft:rgba(226,176,74,.14);
  --shadow:0 12px 32px rgba(0,0,0,.42);--scrim:rgba(4,5,8,.62);--lift:inset 0 1px 0 rgba(255,255,255,.05);
}
body[data-theme=light]{
  color-scheme:light;
  --deep:#eef1f5;--bg:#f5f7fa;--surface:#ffffff;--surface-2:#f3f5f8;--surface-3:#e8ecf2;
  --line:rgba(17,24,39,.08);--line-2:rgba(17,24,39,.14);
  --text:#111827;--muted:#4b5565;--faint:#626b7e;
  --accent:#2f5fd0;--accent-soft:rgba(47,95,208,.09);--accent-text:#2a55bd;
  --ok:#137a3a;--ok-soft:rgba(22,163,74,.10);--bad:#c81e1e;--bad-soft:rgba(220,38,38,.08);
  --hl:#8a5a00;--hl-soft:rgba(250,204,21,.30);
  --shadow:0 8px 24px rgba(0,0,0,.07);--scrim:rgba(17,24,39,.32);--lift:0 1px 2px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-corner{background:transparent}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:var(--r-ctl)}.skip:focus{left:64px}
.app{display:grid;grid-template-columns:56px 240px minmax(0,1fr) 352px;grid-template-rows:56px minmax(0,1fr) 28px;height:100vh}
body.no-drawer .app{grid-template-columns:56px 240px minmax(0,1fr) 0}
body.no-drawer .drawer{display:none}
.rail{grid-column:1;grid-row:1/4}.top{grid-column:2/5;grid-row:1}.side{grid-column:2;grid-row:2}main{grid-column:3;grid-row:2}.drawer{grid-column:4;grid-row:2}.status{grid-column:2/5;grid-row:3}
/* rail */
.rail{background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.logo{width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;margin-bottom:12px;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.logo svg.ic{width:18px;height:18px;stroke-width:2}
.rbtn{width:40px;height:40px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--faint);position:relative;transition:background-color .15s var(--ease),color .15s var(--ease)}
.rbtn:hover{color:var(--text);background:var(--surface)}
.rbtn.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2),var(--lift)}
.rbtn .tt{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--surface-3);color:var(--text);font-size:12px;padding:4px 8px;border-radius:var(--r-tag);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s var(--ease);z-index:30;box-shadow:var(--shadow)}
.rbtn:hover .tt,.rbtn:focus-visible .tt{opacity:1}
/* top */
.top{display:flex;align-items:center;gap:8px;padding:0 16px 0 24px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{color:var(--muted)}.crumbs button:hover{color:var(--text)}
.crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}.crumbs .sep{color:var(--faint)}
.search{margin-left:auto;width:240px;height:32px;border-radius:var(--r-ctl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;color:var(--faint);flex:none;text-align:left;transition:box-shadow .15s var(--ease)}
.search span:not(.kbd){overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.search:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.kbd{margin-left:auto;font:12px var(--mono);color:var(--muted);padding:0 6px;height:20px;line-height:19px;border-radius:var(--r-tag);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2),inset 0 -1px 0 var(--line-2);flex:none}
.seg{display:flex;background:var(--surface);border-radius:var(--r-ctl);padding:2px;box-shadow:inset 0 0 0 1px var(--line-2);flex:none;gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:6px;color:var(--muted);font-size:12px;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:var(--lift)}
.seg.sm button{height:28px;padding:0 6px;flex:1;text-align:center}
.iconbtn{width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);flex:none}
.iconbtn:hover,.iconbtn.on{color:var(--text)}
/* sidebar */
.side{background:var(--deep);border-right:1px solid var(--line);padding:8px 12px 16px;overflow:auto;min-height:0}
.sh{font-size:12px;color:var(--faint);padding:24px 8px 8px;display:flex;justify-content:space-between}
.sh:first-child{padding-top:8px}
.sh span:last-child{font-family:var(--mono)}
.ep{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin-bottom:2px;border-radius:var(--r-ctl);color:var(--muted);font-size:13px;width:100%;transition:background-color .15s var(--ease),color .15s var(--ease)}
.ep:hover{background:var(--surface);color:var(--text)}
.ep .dot{width:6px;height:6px;border-radius:50%;flex:none}
.ep .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .n{margin-left:auto;font:12px var(--mono);color:var(--faint);flex:none}
.ep.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2),var(--lift)}
.runs{margin:4px 0 8px 16px;border-left:1px solid var(--line-2);padding-left:8px}
.run{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin-bottom:2px;border-radius:var(--r-ctl);color:var(--muted);font-size:13px;width:100%}
.run:hover{background:var(--surface);color:var(--text)}
.run.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 2px 0 0 var(--accent);border-radius:0 8px 8px 0}
.rv{margin-left:auto;font:12px var(--mono);font-variant-numeric:tabular-nums;color:var(--faint);flex:none}
.rv.ok{color:var(--ok)}.rv.bad{color:var(--bad)}
/* main */
main{overflow:auto;padding:24px 24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;outline:none}
main>*{flex-shrink:0}
main.fill{padding:0;overflow:hidden;gap:0}
.eyebrow{font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;color:var(--faint)}
.badge::before{content:"·";margin-right:8px}
h1{font-size:28px;line-height:1.15;font-weight:500;margin-top:8px;overflow-wrap:anywhere}
h1 span{color:var(--muted);font-weight:400}
.meta{color:var(--muted);margin-top:8px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.five{grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:inset 0 0 0 1px var(--line),var(--lift);min-width:0;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
button.kpi{transition:box-shadow .15s var(--ease)}
button.kpi:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.kpi .l>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kpi .l>span:first-child{flex:0 1 auto}
.kpi .l>span+span{flex:0 10 auto}
.kpi .v{font:500 28px/1 var(--ui);margin-top:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{color:var(--faint);font-size:16px;font-weight:400}
.kpi .s{font-size:12px;color:var(--faint);margin-top:8px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s.wrap{white-space:normal;line-height:1.5}
.kpi.hero .v{font-size:32px}
.kpi.hero.bad .v{color:var(--bad)}.kpi.hero.good .v{color:var(--ok)}
.bar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:12px;overflow:hidden}
.bar.thin{margin-top:8px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--muted)}
.bar i.acc{background:var(--accent)}
.chips{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:12px var(--mono);padding:2px 8px;height:24px;border-radius:var(--r-tag);white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--hl)}.c-acc{color:var(--accent-text)}.c-mute{color:var(--muted)}
.chip.c-ok{background:var(--ok-soft)}.chip.c-bad{background:var(--bad-soft)}.chip.c-warn{background:var(--hl-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.ov{grid-template-columns:minmax(0,1fr)}
@media (min-width:1760px){.grid2.ov{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--line),var(--lift);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:48px}
.ch h2{font-size:14px;font-weight:500;white-space:nowrap}
.ch .sub{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.gv{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.gv svg.ic{color:var(--faint)}
.empty{padding:32px 16px;color:var(--muted);text-align:center;line-height:1.6}
/* tick marks: the signature */
.tk{display:inline-flex;align-items:center;gap:8px;font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk svg.ic,.mark svg.ic{width:14px;height:14px;stroke-width:2;flex:none}
.tks{display:flex;gap:12px;margin-top:12px}
.tks .tk{font-size:13px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:0 4px}
.tab{height:44px;padding:0 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center;transition:color .15s var(--ease)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .cnt{font:12px var(--mono);color:var(--faint)}
/* trajectory */
.legend{display:flex;gap:16px;padding:8px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
.steps{padding:4px 8px 8px;max-height:560px;overflow:auto}
.step{display:grid;grid-template-columns:24px 100px 96px minmax(40px,1fr) 88px;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-tag);font-size:12px;height:28px;width:100%;white-space:nowrap}
.step:hover{background:var(--surface-2)}
.step .i{font:12px var(--mono);color:var(--faint);text-align:right}
.step .tool{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.step .tbl{display:flex;align-items:center;gap:8px;overflow:hidden;min-width:0}
.step .tbl span{overflow:hidden;text-overflow:ellipsis}
.step .tbl i{width:6px;height:6px;border-radius:50%;flex:none}
.rows{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.rows b{display:block;height:100%;border-radius:2px;background:var(--faint)}
.rem{font:12px var(--mono);color:var(--faint);text-align:right;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.step.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent);border-radius:0 4px 4px 0}
.step.sub{background:var(--surface-2)}
.step.err .tool{color:var(--bad)}
.mark{display:inline-flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--hl)}
.timeline{padding:16px}
.tl{display:flex;gap:2px;align-items:flex-end;height:128px;border-bottom:1px solid var(--line-2);padding-bottom:2px}
.tl button{flex:1;border-radius:2px 2px 0 0;min-width:3px;opacity:.8;transition:opacity .15s var(--ease)}
.tl button:hover,.tl button.on{opacity:1;outline:2px solid var(--text);outline-offset:1px}
.tlx{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--faint);margin-top:8px}
.inspect{border-top:1px solid var(--line);padding:12px 16px 16px;font-size:12px}
pre.json{font:12px/1.6 var(--mono);background:var(--surface-2);border-radius:var(--r-ctl);padding:12px;overflow:auto;max-height:200px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
pre.json.tall{max-height:none}
pre.json .k{color:var(--text)}pre.json .s{color:var(--muted)}pre.json .n{color:var(--text)}
.idchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:112px;overflow:auto}
.idc{font:12px var(--mono);padding:2px 6px;border-radius:var(--r-tag);background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.idc:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--faint)}
.idc.ev{background:var(--hl-soft);color:var(--hl)}
/* verdict */
.find{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;width:100%;min-height:52px;transition:background-color .15s var(--ease)}
.find:hover{background:var(--surface-2)}
.find.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.ftype{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.fids{font:12px var(--mono);color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.famt{font:13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.why{font-size:12px;color:var(--faint);text-align:right;margin-top:2px}
.sect{font-size:12px;color:var(--faint);padding:12px 16px 8px}
.miss{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 16px;font-size:12px;width:100%;white-space:nowrap;min-height:52px}
.miss:hover{background:var(--surface-2)}
.miss .r{color:var(--muted);font:12px var(--mono);text-align:right}
.formula{margin:12px 16px 16px;padding:12px;border-radius:var(--r-ctl);background:var(--surface-2);font:13px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.formula b{color:var(--text);font-weight:500}.formula .eq{font-weight:500}
/* issue cards */
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.icard{background:var(--surface);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--line-2);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:box-shadow .15s var(--ease),background-color .15s var(--ease)}
.icard:hover{background:var(--surface-2)}
.icard.on{box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.icard .hd{display:flex;align-items:baseline;gap:8px;width:100%}
.icard .tid{font:12px var(--mono);color:var(--faint)}
.icard .ty{font-weight:500;font-size:14px}
.icard .amt{margin-left:auto;font:13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.icard .ex{color:var(--muted);font-size:13px;line-height:1.6}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font:12px var(--mono);padding:2px 6px;border-radius:var(--r-tag);background:var(--surface-2);color:var(--muted)}
button.tag:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--faint)}
/* data tables */
.tbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.filter{height:32px;width:260px;border-radius:var(--r-ctl);border:0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);padding:0 12px;outline:none;color:var(--text)}
.filter:focus{box-shadow:inset 0 0 0 1px var(--accent)}
.filter::placeholder{color:var(--faint)}
.pager{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.pbtn{width:28px;height:28px;border-radius:var(--r-tag);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.pbtn:hover{color:var(--text)}
.pbtn[disabled]{opacity:.4;cursor:default}
.tablewrap{overflow:auto;max-height:calc(100vh - 336px);min-height:240px}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.dt th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:400;color:var(--faint);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
table.dt td{height:32px;padding:0 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:not(.ev):not(.sel):hover td{background:var(--surface-2)}
table.dt tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.dt td.r,table.dt th.r{text-align:right}
table.dt tr.ev td{background:var(--hl-soft)}
table.dt tr.ev td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
table.dt tr.sel:not(.ev) td{background:var(--accent-soft)}
table.dt tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
table.dt.plain tbody tr{cursor:default}
table.dt.plain td{height:auto;padding:8px 12px}
table.dt td b{font-weight:500}
table.dt th:first-child,table.dt td:first-child,table.dt.plain td:first-child{padding-left:16px}
table.dt th:last-child,table.dt td:last-child,table.dt.plain td:last-child{padding-right:16px}
.lk{font:12px var(--mono);color:var(--text);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;border-radius:var(--r-tag)}
.lk:hover{color:var(--accent-text);text-decoration-color:currentColor}
.lk svg.ic{vertical-align:-4px;margin-left:4px}

  var input = h('input', { placeholder: t('pal'), 'aria-label': t('pal'), role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'plist', autocomplete: 'off' });
  var list = h('div', { class: 'plist', role: 'listbox', id: 'plist' });
  p.appendChild(h('div', { class: 'pbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': t('search') }, input, list));
  p.onclick = function (e) { if (e.target === p) closePalette(); };
  function refresh() {
    var q = input.value.trim().toLowerCase(), items = [];
    [['overview', t('overview')], ['check', t('check')], ['rubric', t('rubric')]].forEach(function (v) { items.push({ k: t('k_view'), label: v[1], sub: '', run: function () { go({ view: v[0] }); } }); });
    EPS.forEach(function (e) {
      items.push({ k: t('k_episode'), label: e.name, sub: t(e.split) + ' · ' + e.truth.issues.length, run: function () { go({ view: 'episode', ep: e.name, tab: 'key', sel: null, issue: null, finding: null, step: null }); } });
      items.push({ k: t('k_view'), label: t('graph') + ' · ' + e.name, sub: '', run: function () { go({ view: 'graph', ep: e.name, sel: null, issue: null }); } });
      POLICIES.forEach(function (p2) { var r = runOf(e, p2); if (r) items.push({ k: t('k_run'), label: p2 + ' · ' + e.name, sub: signed(r.reward), run: function () { go({ view: 'run', ep: e.name, run: p2, step: null, finding: null, sel: null, issue: null }); } }); });
    });
    var ep = S.ep && epByName(S.ep);
    if (ep && q.length >= 2) {
      var X = ix(ep), cnt = 0;
      [['row', X.row], ['invoice', X.inv], ['payment', X.pay], ['fx', X.fx], ['entity', X.byEnt]].forEach(function (pair) {
        pair[1].forEach(function (rec, id) {
          if (cnt < 60 && id.toLowerCase().indexOf(q) >= 0) {
            cnt++;
            items.unshift({ k: t('k_record'), label: id, sub: t('k_' + pair[0]) + ' · ' + ep.name, run: function () { if (S.view === 'overview' || S.view === 'check' || S.view === 'rubric') go({ view: 'episode', sel: id }); else go({ sel: id }); } });
          }
        });
      });
    }
    pal.items = q ? items.filter(function (it) { return (it.label + ' ' + it.sub + ' ' + it.k).toLowerCase().indexOf(q) >= 0; }).slice(0, 80) : items.slice(0, 40);
    pal.idx = 0; draw();
  }
  function draw() {
    list.textContent = '';
    if (!pal.items.length) list.appendChild(h('div', { class: 'hint', role: 'option', 'aria-disabled': 'true', text: t('pal_none') }));
    pal.items.forEach(function (it, i) {
      list.appendChild(h('button', { class: 'pitem' + (i === pal.idx ? ' on' : ''), role: 'option', id: 'pi' + i, 'aria-selected': i === pal.idx ? 'true' : 'false', onclick: function () { closePalette(); it.run(); } },
        h('span', { class: 'k', text: it.k }), h('span', { class: 'lab', text: it.label }), h('span', { class: 'sub', text: it.sub })));
    });
    if (pal.items.length) input.setAttribute('aria-activedescendant', 'pi' + pal.idx); else input.removeAttribute('aria-activedescendant');
    input.setAttribute('aria-expanded', pal.items.length ? 'true' : 'false');
    var on = list.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('input', refresh);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { pal.idx = Math.min(pal.items.length - 1, pal.idx + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { pal.idx = Math.max(0, pal.idx - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { var it = pal.items[pal.idx]; if (it) { closePalette(); it.run(); } }
    else if (e.key === 'Escape') { e.stopPropagation(); closePalette(); }
    else if (e.key === 'Tab') e.preventDefault();
  });
  refresh();
  input.focus();
}
function closePalette() {
  var p = document.getElementById('palette'); p.hidden = true; p.textContent = '';
  if (pal.prevFocus && pal.prevFocus.isConnected && pal.prevFocus.focus) pal.prevFocus.focus();
}
document.addEventListener('keydown', function (e) {
  var pOpen = !document.getElementById('palette').hidden;
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyK' || e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (!pOpen) openPalette(); }
  else if (e.key === 'Escape' && !pOpen && (S.sel || S.issue || S.finding !== null || S.step !== null)) {
    if (S.sel) go({ sel: null }); else go({ issue: null, finding: null, step: null });
  }
});
window.addEventListener('popstate', function () { if (location.hash && location.hash.indexOf('#/') !== 0) return; readHash(); render(); });
document.getElementById('skip').addEventListener('click', function (e) { e.preventDefault(); document.getElementById('main').focus(); });

// ------------------------------------------------------------------ boot
if (EPS.length) S.ep = EPS[0].name;
readHash();
try { if (location.hash !== hashOf()) history.replaceState(null, '', hashOf()); } catch (e) { /* file:// quirk */ }
render();
window.__auditgym = { S: S, GS: GS, go: go, causalOf: causalOf, graph: function () { return gmain; } };
})();
</script>
</body>
